name: Fetch skills

# Daily full scrape. This scheduled run is also the canary against the real
# API: it fails loudly if auth, response shapes or dataset invariants drift.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 18 * * *"

permissions:
  contents: write

concurrency: skills-fetch

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Full scrape (~8.4k skills.sh requests + ~1.2k GitHub star requests, 30-45 min).
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Layer 1: deterministic, secret-free tests must pass before touching the API.
      - name: Offline tests
        run: npm test

      # The Vercel OIDC token expires every ~12h, so it cannot be stored as a
      # secret. Instead, mint a fresh one here from the long-lived VERCEL_TOKEN
      # by linking the project and pulling the development env.
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Mint Vercel OIDC token
        run: npx vercel@latest env pull .env.local
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Seed the scraper with the previous snapshot: the upstream hashes in
      # its skills.jsonl pin fetchedAt, reuse unchanged audit results, keep
      # the last good content of failed fetches, and make the changed/added/
      # removed counters describe this run instead of the empty workspace.
      # No-op on the very first run (no dist branch yet).
      - name: Restore previous snapshot
        run: |
          if git fetch -q origin dist; then
            mkdir -p data
            git archive origin/dist -- skills skills.jsonl stats.json | tar -x -C data
          fi

      - name: Scrape all skills
        run: node scraper.mjs
        env:
          # Built-in token for the per-repo star counts (GitHub REST, 5000 req/hr).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Layer 2: dataset invariants gate the publish.
      - name: Verify dataset
        run: node verify.mjs

      # Data is published to the dist branch: one commit per day, history
      # pruned to the newest 5 commits, so the branch stays a bounded,
      # browsable archive of recent daily snapshots. The snapshot sits at the
      # branch root: skills.jsonl, stats.json and skills/.
      - name: Publish to dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Park the fresh snapshot; load the current dist branch if it exists.
          mv data data-fresh
          if git fetch -q origin dist; then
            git checkout -q -B dist FETCH_HEAD
          else
            git checkout -q --orphan dist
            git rm -rq --cached .
          fi
          # Drop the retired layout (the snapshot used to live under data/).
          git rm -rq --ignore-unmatch data
          rm -rf skills skills.jsonl stats.json
          mv data-fresh/skills data-fresh/skills.jsonl data-fresh/stats.json .
          rm -rf data-fresh
          git add -f skills skills.jsonl stats.json
          git commit -qm "skills.sh data — $(date -u +%F)"

          # Prune: re-root the newest 5 commits (no diff replay) when over.
          if [ "$(git rev-list --count HEAD)" -gt 5 ]; then
            new=$(git commit-tree "$(git rev-parse HEAD~4^{tree})" -m "$(git log -1 --format=%B HEAD~4)")
            for i in 3 2 1 0; do
              new=$(git commit-tree "$(git rev-parse HEAD~$i^{tree})" -p "$new" -m "$(git log -1 --format=%B HEAD~$i)")
            done
            git reset -q --hard "$new"
          fi
          git push -q --force origin dist

          # Tag each retained snapshot as dist-<date> so consumers can pin a
          # day without tracking the branch. The name is deliberately
          # slash-free: raw.githubusercontent.com resolves dist/<date>/file
          # as the dist branch plus a path (the shorter ref wins) and 404s,
          # while dist-<date> is unambiguous and works in single-file raw
          # URLs. Tags mirror the 5-commit window:
          # when prune re-roots the commits (which resets commit dates), the
          # date comes from the commit subject, and tags for days that fell
          # out of the window are deleted — otherwise they would keep the
          # pruned objects alive forever and grow the repo.
          git fetch -q origin "+refs/tags/dist-*:refs/tags/dist-*" || true
          kept=""
          n=$(git rev-list --count HEAD); [ "$n" -gt 5 ] && n=5
          # Oldest first, so when one day was published twice the newest
          # snapshot of that day wins the tag.
          while [ "$n" -gt 0 ]; do
            n=$((n - 1))
            sha=$(git rev-parse "HEAD~$n")
            day=$(git log -1 --format=%s "$sha"); day=${day##*— }
            git tag -f "dist-$day" "$sha"
            kept="$kept dist-$day"
          done
          for tag in $(git tag -l 'dist-*'); do
            case " $kept " in *" $tag "*) continue ;; esac
            git tag -d "$tag"
            git push -q origin ":refs/tags/$tag"
          done
          for tag in $kept; do
            # "+" force: a day published twice re-points its existing tag at
            # the newest snapshot, and a non-fast-forward tag update needs it.
            git push -q origin "+refs/tags/$tag:refs/tags/$tag"
          done
