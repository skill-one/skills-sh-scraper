name: Fetch skills

# Daily full scrape. This scheduled run is also the canary against the real
# API: it fails loudly if auth, response shapes or dataset invariants drift.

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

permissions:
  contents: write

concurrency: skills-fetch

jobs:
  fetch:
    runs-on: ubuntu-latest
    # Full scrape (~8.4k requests, 15-30 min) plus a sampled resume check.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # Layer 1: deterministic, secret-free tests must pass before touching the API.
      - name: Offline tests
        run: npm test

      # The Vercel OIDC token expires every ~12h, so it cannot be stored as a
      # secret. Instead, mint a fresh one here from the long-lived VERCEL_TOKEN
      # by linking the project and pulling the development env.
      - name: Link Vercel project
        run: |
          mkdir -p .vercel
          printf '{"orgId":"%s","projectId":"%s"}\n' "$VERCEL_ORG_ID" "$VERCEL_PROJECT_ID" > .vercel/project.json
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Mint Vercel OIDC token
        run: npx vercel@latest env pull .env.local
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Scrape all skills
        run: node scraper.mjs

      # The previous skills.jsonl drives resume: a sampled second run over the
      # top 500 skills must save (almost) nothing new — mass `saved` would mean
      # the index is not being read or written correctly. A handful of saves
      # can be legitimate (skills that just entered the top 500, or that failed
      # in the main run); more than that is a resume bug. Per-skill upstream
      # failures (permanent 400s) are expected; the scraper exits non-zero
      # only on systemic failures. The sample writes into a throwaway copy,
      # so the real dataset stays exactly as the full scrape left it.
      - name: Resume check
        run: |
          set -o pipefail
          cp -a data resume-data
          node scraper.mjs --out resume-data --limit 500 2>&1 | tee resume.log
          saved=$(node -p "JSON.parse(require('fs').readFileSync('resume-data/stats.json', 'utf8')).saved")
          echo "resume saved ${saved} of the 500 sampled skills"
          [ "$saved" -le 5 ] || { echo "resume broken: too many saves"; exit 1; }
          rm -rf resume-data

      # Layer 2: dataset invariants gate the publish.
      - name: Verify dataset
        run: node verify.mjs

      # Data is published to the dist branch: one commit per day, history
      # pruned to the newest 5 commits, so the branch stays a bounded,
      # browsable archive of recent daily snapshots.
      - name: Publish to dist branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Park the fresh snapshot; load the current dist branch if it exists.
          mv data data-fresh
          if git fetch -q origin dist; then
            git checkout -q -B dist FETCH_HEAD
          else
            git checkout -q --orphan dist
            git rm -rq --cached .
          fi
          rm -rf data
          mv data-fresh data
          git add -f data
          git commit -qm "skills.sh data — $(date -u +%F)"

          # Prune: re-root the newest 5 commits (no diff replay) when over.
          if [ "$(git rev-list --count HEAD)" -gt 5 ]; then
            new=$(git commit-tree "$(git rev-parse HEAD~4^{tree})" -m "$(git log -1 --format=%B HEAD~4)")
            for i in 3 2 1 0; do
              new=$(git commit-tree "$(git rev-parse HEAD~$i^{tree})" -p "$new" -m "$(git log -1 --format=%B HEAD~$i)")
            done
            git reset -q --hard "$new"
          fi
          git push -q --force origin dist
